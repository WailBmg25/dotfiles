general {
    disable_loading_bar = true
}

background {
    color = rgba(31,29,46,0.9)
}

# TIME (top center)
label {
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    font_size = 60
    color = rgba(224,222,244,1.0)

    position = 0, 200
    halign = center
    valign = center
}

# DATE (under time)
label {
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    font_size = 22
    color = rgba(224,222,244,0.7)

    position = 0, 140
    halign = center
    valign = center
}

# INPUT FIELD (center, clearly separated)
input-field {
    size = 280, 60
    outline_thickness = 3

    outer_color = rgba(191,124,255,0.8)   # nice accent instead of flat dark
    inner_color = rgba(31,29,46,0.8)
    font_color = rgba(224,222,244,1.0)

    check_color = rgba(235,111,146,1.0)
    fail_color = rgba(49,116,143,1.0)

    placeholder_text = <i>Enter Password</i>

    position = 0, 0
    halign = center
    valign = center
}

# Bottom hint
label {
    text = Press Enter to unlock
    font_size = 14
    color = rgba(224,222,244,0.5)

    position = 0, -120
    halign = center
    valign = center
}
label {
    text = cmd[update:1000] sh -c "hyprctl devices | grep -A 5 'Keyboard' | grep 'active keymap' | head -n1 | awk -F': ' '{print $2}'"
    font_size = 16
    color = rgba(224,222,244,0.6)

    position = 0, -160
    halign = center
    valign = center
}

